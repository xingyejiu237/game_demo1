<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c14">
<title>钢铁前线 · 云想游戏厅</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314142a'/%3E%3Crect x='0' y='6' width='16' height='4' rx='1' fill='%23c8c8d8'/%3E%3Crect x='4' y='3' width='2' height='10' fill='%23101018'/%3E%3Crect x='2' y='5' width='6' height='2' fill='%23101018'/%3E%3Crect x='10' y='4' width='2' height='2' fill='%23e40000'/%3E%3Crect x='12' y='6' width='2' height='2' fill='%232838f8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="256" height="240"></canvas>

  <!-- 触摸按钮(仅触摸设备显示):十字方向 + 射击 -->
  <div id="touch" class="touch-ui">
    <div class="pad-left">
      <div class="dpad">
        <button class="tbtn dp-up"    data-key="up"><span>&#9650;</span></button>
        <button class="tbtn dp-left"  data-key="left"><span>&#9664;</span></button>
        <button class="tbtn dp-right" data-key="right"><span>&#9654;</span></button>
        <button class="tbtn dp-down"  data-key="down"><span>&#9660;</span></button>
      </div>
    </div>
    <div class="pad-right">
      <button class="tbtn btn-fire" data-key="fire"><span>开火</span></button>
    </div>
  </div>
</div>

<script src="../../js/audio.js"></script>
<script src="../../js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/main.js"></script>
</body>
</html>
