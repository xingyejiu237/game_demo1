<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>蘑菇勇者 · 云想游戏厅</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="256" height="240"></canvas>

  <!-- 触摸按钮(仅触摸设备显示) -->
  <div id="touch" class="touch-ui">
    <div class="pad-left">
      <button class="tbtn btn-left"  data-key="left"><span>&#9664;</span></button>
      <button class="tbtn btn-right" data-key="right"><span>&#9654;</span></button>
    </div>
    <div class="pad-right">
      <button class="tbtn btn-b" data-key="run" data-hold="1"><span>B</span></button>
      <button class="tbtn btn-a" data-key="jump"><span>A</span></button>
    </div>
  </div>
</div>

<script src="../../js/audio.js"></script>
<script src="../../js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/level.js"></script>
<script src="js/levels/w1-1.js"></script>
<script src="js/entities.js"></script>
<script src="js/main.js"></script>
</body>
</html>
