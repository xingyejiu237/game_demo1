<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 背景 -->
  <rect width="16" height="16" rx="3" fill="#14142a"/>
  <!-- 手柄主体(亮灰,一体成型,底部收窄成握把) -->
  <rect x="4" y="3" width="8" height="1" fill="#d8d8e8"/>
  <rect x="2" y="4" width="12" height="1" fill="#d8d8e8"/>
  <rect x="1" y="5" width="14" height="7" fill="#d8d8e8"/>
  <rect x="2" y="12" width="12" height="1" fill="#d8d8e8"/>
  <rect x="3" y="13" width="2" height="2" fill="#d8d8e8"/>
  <rect x="11" y="13" width="2" height="2" fill="#d8d8e8"/>
  <!-- 方向键(深蓝黑,在主体上) -->
  <rect x="4" y="6" width="3" height="4" fill="#1a1a2a"/>
  <rect x="2" y="7" width="7" height="1" fill="#1a1a2a"/>
  <!-- 2x2 按键矩阵(红黄/蓝绿) -->
  <rect x="10" y="6" width="2" height="2" fill="#e40000"/>
  <rect x="12" y="6" width="2" height="2" fill="#f8c800"/>
  <rect x="10" y="8" width="2" height="2" fill="#2838f8"/>
  <rect x="12" y="8" width="2" height="2" fill="#28a030"/>
  <!-- Start/Select 小点 -->
  <rect x="9" y="8" width="1" height="1" fill="#1a1a2a"/>
  <rect x="9" y="9" width="1" height="1" fill="#1a1a2a"/>
</svg>
