<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>render check</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="256" height="240"></canvas>
</div>
<pre id="out"></pre>
<script src="../js/sprites.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/input.js"></script>
<script src="../js/level.js"></script>
<script src="../js/levels/w1-1.js"></script>
<script src="../js/entities.js"></script>
<script src="../js/main.js"></script>
<script>
// 无头验证:走真实游戏循环(_boot 启动 rAF 主循环),虚拟时间跑 5 秒后 dump 像素
(function () {
  var _fail = function (err) {
    var out = document.getElementById('out');
    if (out) out.textContent = 'ERROR: ' + (err && err.stack || err);
  };
  try {
    var mode = (location.search.match(/mode=(\w+)/) || [])[1] || 'idle';
    Game._boot();
    setTimeout(function () {
      Game.startGame();
      var a = Input.actions;
      try {
        var N = 200;
        for (var i = 0; i < N; i++) {
          if (mode === 'jump') { if (i < 60) { a.dir = 1; a.jump = true; a.jumpTap = true; } else if (i === 60) { a.jumpTap = true; } else if (i < 90) { a.dir = 1; a.jump = true; } else { a.jump = false; } }
          Game._step(1 / 60);
          Game._render();
        }
        dump();
      } catch (e) {
        document.getElementById('out').textContent = 'STEP ERROR: ' + (e.stack || e);
      }
    }, 500);

    function dump() {
      var cv = document.getElementById('game');
      var ctx = cv.getContext('2d');
      var img = ctx.getImageData(0, 0, 256, 240).data;
      var lines = [];
      var magenta = 0;
      for (var y = 0; y < 240; y += 4) {
        var line = '';
        for (var x = 0; x < 256; x += 4) {
          var i = (y * 256 + x) * 4;
          var r = img[i], g = img[i + 1], b = img[i + 2], al = img[i + 3];
          if (al === 0) { line += ' '; continue; }
          if (r > 180 && g < 90 && b > 180) { line += 'M'; magenta++; continue; }
          if (g > 100 && r < 150 && b < 150) { line += 'G'; continue; }
          if (r > 170 && g > 70 && g < 170 && b < 90) { line += '#'; continue; }
          if (b > 140 && r < 160) { line += '.'; continue; }
          if (r > 200 && g > 200 && b > 200) { line += 'W'; continue; }
          if (r < 70 && g < 70 && b < 70) { line += ' '; continue; }
          if (r > 150 && g < 100 && b < 100) { line += 'R'; continue; }
          if (r > 100 && g < 90 && b > 140) { line += 'B'; continue; }
          line += '+';
        }
        lines.push(line);
      }
      // 关键点精确 RGB
      var pp = Game.player();
      var cam = Game._cam();
      var lv = Game.level;
      function px(x, y) { var i = (y * 256 + x) * 4; return img[i] + ',' + img[i + 1] + ',' + img[i + 2]; }
      var info = [];
      info.push('玩家 x=' + pp.x.toFixed(2) + ' y=' + pp.y.toFixed(2) + ' 底=' + (pp.y + pp.h).toFixed(2));
      info.push('相机=' + cam.toFixed(1) + ' groundTopY=' + lv.groundTopY());
      info.push('玩家中心(' + ((pp.x - cam + 6) | 0) + ',' + ((pp.y + 8) | 0) + ') = ' + px((pp.x - cam + 6) | 0, (pp.y + 8) | 0));
      info.push('玩家脚底下方 1px(' + ((pp.x - cam + 6) | 0) + ',' + ((pp.y + pp.h + 1) | 0) + ') = ' + px((pp.x - cam + 6) | 0, (pp.y + pp.h + 1) | 0));
      info.push('脚底下方 4px = ' + px((pp.x - cam + 6) | 0, (pp.y + pp.h + 4) | 0));
      info.push('脚底下方 8px = ' + px((pp.x - cam + 6) | 0, (pp.y + pp.h + 8) | 0));
      info.push('脚底下方 16px = ' + px((pp.x - cam + 6) | 0, (pp.y + pp.h + 16) | 0));
      info.push('第一只板栗仔 x=' + (Game._enemies()[0] && Game._enemies()[0].x.toFixed(1)));
      document.getElementById('out').textContent =
        'mode=' + mode + ' 品红像素=' + magenta + '\n' + info.join('\n') + '\n' + lines.join('\n');
    }
  } catch (err) { _fail(err); }
})();
</script>
</body>
</html>
