<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12121c">
<title>云想游戏厅 · YUNXIANG ARCADE</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2314142a'/%3E%3Crect x='0' y='6' width='16' height='4' rx='1' fill='%23c8c8d8'/%3E%3Crect x='4' y='3' width='2' height='10' fill='%23101018'/%3E%3Crect x='2' y='5' width='6' height='2' fill='%23101018'/%3E%3Crect x='10' y='4' width='2' height='2' fill='%23e40000'/%3E%3Crect x='12' y='6' width='2' height='2' fill='%232838f8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======== 主菜单 ======== -->
<div id="console">
  <header class="arcade-head">
    <div class="arcade-logo">
      <div class="logo-pixels"></div>
      <h1>云想游戏厅</h1>
      <p>YUNXIANG ARCADE · 童年一盒装</p>
    </div>
  </header>

  <div id="cart-grid"></div>

  <footer class="arcade-foot">
    <p>仅供学习交流 · 非商业用途 · 全部素材原创</p>
    <p class="dim">插上卡带,回到 1990</p>
  </footer>
</div>

<!-- ======== 游戏容器(iframe) ======== -->
<div id="game-wrap" class="hidden">
  <button id="btn-back" aria-label="返回主菜单">‹ 菜单</button>
  <iframe id="game-frame" src="about:blank" allow="autoplay"></iframe>
</div>

<script src="js/platform.js"></script>
</body>
</html>
